name: Documentation
on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'deployments/*.md'
      - 'examples/README.md'
      - 'web/README.md'
      - 'web/templates/module/README.md'
      - 'web/packages/errors/README.md'
      - 'web/apps/console/public/favicon.svg'
      - '.github/assets/**'
      - '.github/workflows/docs.yml'
      - 'scripts/stamp-release.mjs'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'deployments/*.md'
      - 'examples/README.md'
      - 'web/README.md'
      - 'web/templates/module/README.md'
      - 'web/packages/errors/README.md'
      - 'web/apps/console/public/favicon.svg'
      - '.github/assets/**'
      - '.github/workflows/docs.yml'
      - 'scripts/stamp-release.mjs'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version without v; omit for validation only
        type: string
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Stamp release documentation version
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/stamp-release.mjs "$RELEASE_VERSION"
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/docs-yarn-cache
          key: ${{ runner.os }}-docs-yarn-${{ hashFiles('website/yarn.lock') }}
      - name: Install documentation dependencies
        working-directory: website
        env:
          YARN_CACHE_FOLDER: ${{ runner.temp }}/docs-yarn-cache
        run: yarn install --frozen-lockfile
      - name: Build and validate links
        working-directory: website
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            node -e 'if (require("./package.json").version !== process.env.RELEASE_VERSION) process.exit(1)'
            export DOCS_VERSION="v$RELEASE_VERSION"
          fi
          yarn build
      - name: Archive release documentation
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: tar -czf "backplane_${RELEASE_VERSION}_docs.tar.gz" -C website/build .
      - uses: actions/upload-artifact@v6
        if: inputs.version != ''
        with:
          name: release-docs
          path: backplane_*_docs.tar.gz
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: inputs.version != ''
        with:
          path: website/build
