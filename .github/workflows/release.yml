name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Artifact version for a build-only rehearsal (normally taken from the tag)'
        required: true
        default: '0.1.1'
permissions:
  actions: read
  contents: read
  packages: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GOWORK: 'off'
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          [[ "$version" =~ ^[01]\.[0-9]+\.[0-9]+$ ]] || exit 1
          node scripts/stamp-release.mjs "$version"
          node web/scripts/release-packages.mjs "$version" bin/release --check
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require successful CI for this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 360); do
            result="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --json status,conclusion --jq '.[0] | [.status, .conclusion] | join(":")')"
            case "$result" in
              completed:success) exit 0 ;;
              completed:*) echo "Commit CI is $result" >&2; exit 1 ;;
            esac
            sleep 5
          done
          echo 'No successful push CI for the release commit. Push the branch before its tag.' >&2
          exit 1
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@backplane-labs'
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/yarn-cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('web/yarn.lock') }}
      - run: make configure-web
        env:
          YARN_CACHE_FOLDER: ${{ runner.temp }}/yarn-cache
      - name: Build Linux archives, console and frontend packages
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build-release.sh "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v6
        with:
          name: release-files
          path: bin/release/
          retention-days: 7

  docker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: release-files
          path: bin/release
      - name: Restore executable permissions
        run: chmod +x bin/release/linux_*/bin/backplane
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build multi-platform image (publish only on tags)
        id: image
        uses: docker/build-push-action@v7
        with:
          context: bin/release
          file: deployments/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
      - name: Save image digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" > image-digest.txt
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'push'
        with:
          name: image-digest
          path: image-digest.txt

  docs:
    needs: build
    uses: ./.github/workflows/docs.yml
    with:
      version: ${{ needs.build.outputs.version }}

  publish:
    if: github.event_name == 'push'
    needs: [build, docker, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@backplane-labs'
      - uses: actions/download-artifact@v7
        with:
          name: release-files
          path: bin/release
      - uses: actions/download-artifact@v7
        with:
          name: image-digest
          path: bin/release
      - uses: actions/download-artifact@v7
        with:
          name: release-docs
          path: bin/release
      - name: Checksum complete release
        working-directory: bin/release
        run: sha256sum *.tar.gz *.tgz frontend-packages.json image-digest.txt > SHA256SUMS
      - name: Publish coordinated frontend packages to GitHub Packages
        run: |
          node scripts/stamp-release.mjs "$RELEASE_VERSION"
          node web/scripts/release-packages.mjs "$RELEASE_VERSION" bin/release --publish
      - name: Create GitHub Release and upload assets
        run: |
          python3 scripts/release-notes.py "$RELEASE_VERSION" bin/release/image-digest.txt > bin/release/notes.md
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file bin/release/notes.md
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$tag" --notes-file bin/release/notes.md
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber bin/release/*.tar.gz bin/release/*.tgz bin/release/frontend-packages.json bin/release/SHA256SUMS bin/release/image-digest.txt

  pages:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy release documentation
        id: deployment
        uses: actions/deploy-pages@v4
