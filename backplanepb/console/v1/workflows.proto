syntax = "proto3";

package backplane.console.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "schemapb/schema.proto";
import "backplanepb/v1/manifest.proto";

option go_package = "github.com/backplane-labs/backplane/backplanepb/console/v1;consolev1";

// WorkflowService is the console's view of the services' Temporal
// workflows (§9): what they declare, starting one with a form, the runs
// through Temporal visibility and the actions on a run. backplane reaches
// Temporal through its own client (BACKPLANE_TEMPORAL_ADDR); without one
// runtime calls fail with FAILED_PRECONDITION. Backend outages return UNAVAILABLE. Runs the console starts
// carry memo source = console:<session> (§14).
//
// GetRun, CancelRun, TerminateRun and SignalRun address any workflow id of
// backplane's namespace, not only runs on a service's queue: binding and
// rule runs live on backplane's own queue, and the console session is an
// installation operator.
service WorkflowService {
  // Workflows the latest manifests declare: workflows[] and activities
  // of kind WORKFLOW, with the workers polling their task queue.
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  // Starts a declared workflow on the service's task queue. A workflow_id
  // that has a running run is ALREADY_EXISTS; a closed one starts a new run.
  rpc StartWorkflow(StartWorkflowRequest) returns (StartWorkflowResponse);
  // Runs on a service's task queue (or its hook calls), newest start first
  // where the visibility store sorts (Elasticsearch). SQL visibility (the
  // dev server, PostgreSQL, MySQL) refuses ORDER BY; there the order is
  // Temporal's own: running runs first, then by close time, newest first.
  // ListRunsResponse.query shows which query ran.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  // One run: status, input, result or failure, pending activities and
  // its history as a timeline.
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  // Requests cancellation: the workflow sees it and may clean up.
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
  // Ends the run at once, without the workflow's code.
  rpc TerminateRun(TerminateRunRequest) returns (TerminateRunResponse);
  // Sends a signal with a JSON argument, or none.
  rpc SignalRun(SignalRunRequest) returns (SignalRunResponse);
}

// ScheduleService administrates Temporal schedules. Temporal is the source
// of truth; modules only declare and execute workflows. SDK reconciliation
// never creates, changes or deletes schedules. Disabled: FAILED_PRECONDITION;
// configured but unavailable: UNAVAILABLE. Mutations are audited.
service ScheduleService {
  // Reads a schedule even if its service has no running instances.
  rpc GetSchedule(GetScheduleRequest) returns (GetScheduleResponse);
  // Creates for a declared workflow; duplicate id: ALREADY_EXISTS.
  rpc CreateSchedule(CreateScheduleRequest) returns (CreateScheduleResponse);
  // Optimistic update using GetSchedule revision; conflict: ABORTED.
  // Operator pause, note and execution counters are always preserved.
  rpc UpdateSchedule(UpdateScheduleRequest) returns (UpdateScheduleResponse);
  // Deletes the schedule, leaving existing workflow runs intact.
  rpc DeleteSchedule(DeleteScheduleRequest) returns (DeleteScheduleResponse);
  // Schedules stored in Temporal under a service prefix, including services
  // no longer present in the registry. Legacy declarations are annotations.
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
  rpc PauseSchedule(PauseScheduleRequest) returns (PauseScheduleResponse);
  rpc UnpauseSchedule(UnpauseScheduleRequest) returns (UnpauseScheduleResponse);
  // Starts the schedule's action now, whatever its overlap policy. The run
  // carries the schedule's action (memo included): Temporal takes no memo
  // on a trigger, so who triggered it is in the audit, not on the run.
  rpc TriggerSchedule(TriggerScheduleRequest) returns (TriggerScheduleResponse);
}

// What a startable workflow is.
enum WorkflowKind {
  WORKFLOW_KIND_UNSPECIFIED = 0;
  // workflows.Declare: input and output are the author's types (JSON).
  WORKFLOW_KIND_WORKFLOW = 1;
  // An activity of kind WORKFLOW: input and output are the ActivityCall
  // and ActivityResult envelopes; the console wraps the JSON input.
  WORKFLOW_KIND_ACTIVITY = 2;
}

message WorkflowDef {
  string service = 1;
  // Workflow type.
  string name = 2;
  WorkflowKind kind = 3;
  string description = 4;
  schemapb.Schema input = 5;
  schemapb.Schema output = 6;
  // Task queue it runs on: the service's.
  string task_queue = 7;
  // Workers that polled task_queue for workflow tasks recently (Temporal's
  // DescribeTaskQueue); 0: a start waits until a worker comes. Unset when
  // Temporal could not be asked.
  optional int32 pollers = 8;
}

message ListWorkflowsRequest {
  // Only this service; empty: every service.
  string service = 1;
}

message ListWorkflowsResponse {
  // Sorted by service, then name.
  repeated WorkflowDef workflows = 1;
}

message StartWorkflowRequest {
  string service = 1;
  // Declared workflow type.
  string workflow = 2;
  // Input: JSON text; empty is no argument.
  string input = 3;
  // Workflow id; empty: console/<service>/<workflow>/<uuid>. One with a
  // running run is refused (ALREADY_EXISTS).
  string workflow_id = 4;
  // Execution timeout; zero: none.
  google.protobuf.Duration timeout = 5;
}

message StartWorkflowResponse {
  string workflow_id = 1;
  string run_id = 2;
}

// Status of a run (Temporal's WorkflowExecutionStatus).
enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_RUNNING = 1;
  RUN_STATUS_COMPLETED = 2;
  RUN_STATUS_FAILED = 3;
  RUN_STATUS_CANCELED = 4;
  RUN_STATUS_TERMINATED = 5;
  RUN_STATUS_CONTINUED_AS_NEW = 6;
  RUN_STATUS_TIMED_OUT = 7;
}

message Run {
  string workflow_id = 1;
  string run_id = 2;
  string workflow_type = 3;
  RunStatus status = 4;
  string task_queue = 5;
  google.protobuf.Timestamp start_time = 6;
  // Unset while running.
  google.protobuf.Timestamp close_time = 7;
  int64 history_length = 8;
  // Memo, each value as JSON text (source, backplane.service, ...).
  map<string, string> memo = 9;
  // Parent run, when a child workflow.
  string parent_workflow_id = 10;
  string parent_run_id = 11;
}

message ListRunsRequest {
  string service = 1;
  // Only this workflow type.
  string workflow = 2;
  // Only this status.
  RunStatus status = 3;
  // Only workflow ids with this prefix (a schedule's runs:
  // <service>/<Name>-).
  string workflow_id_prefix = 4;
  // At most this many (default 50, at most 500).
  uint32 page_size = 5;
  // From the previous response; empty: the first page.
  bytes page_token = 6;
  // Hook calls of the service instead of its workflows: the
  // backplane.CallHook.v1 runs on <service>.hooks (hooks its code raised)
  // and the console's calls of its hooks (hook/<service>/ on backplane's
  // queue).
  bool hooks = 7;
}

message ListRunsResponse {
  repeated Run runs = 1;
  // Empty on the last page.
  bytes next_page_token = 2;
  // The visibility query that was run.
  string query = 3;
}

message GetRunRequest {
  string workflow_id = 1;
  // Empty: the latest run.
  string run_id = 2;
}

message PendingActivity {
  string activity_id = 1;
  string activity_type = 2;
  // SCHEDULED, STARTED, CANCEL_REQUESTED, PAUSED.
  string state = 3;
  int32 attempt = 4;
  int32 maximum_attempts = 5;
  google.protobuf.Timestamp last_started_time = 6;
  google.protobuf.Timestamp last_heartbeat_time = 7;
  google.protobuf.Timestamp next_attempt_time = 8;
  string last_failure = 9;
  string last_worker = 10;
}

// HistoryEvent is one event of a run's history, summarized.
message HistoryEvent {
  int64 id = 1;
  google.protobuf.Timestamp time = 2;
  // Temporal's event type without the prefix (WorkflowExecutionStarted,
  // ActivityTaskScheduled, ...).
  string type = 3;
  // One line: the activity type, timer, signal, child, failure message.
  string summary = 4;
  // Payload of the event as JSON text where it has one (input, result,
  // signal argument).
  string payload = 5;
  // Failure message, for failed or timed out events.
  string failure = 6;
  // The run the event is about, when another one: the child workflow it
  // starts or ends, the run this one continued as.
  string workflow_id = 7;
  string run_id = 8;
}

message GetRunResponse {
  Run run = 1;
  // Input of the first run event, JSON text.
  string input = 2;
  // Result when completed, JSON text.
  string result = 3;
  // Failure message when failed, timed out or terminated (with its type).
  string failure = 4;
  string failure_type = 5;
  repeated PendingActivity pending_activities = 6;
  // The history, oldest first; at most 1000 events (truncated says more).
  repeated HistoryEvent history = 7;
  bool truncated = 8;
  // The run this one continued as (status CONTINUED_AS_NEW), same
  // workflow id.
  string continued_run_id = 9;
}

message CancelRunRequest {
  string workflow_id = 1;
  string run_id = 2;
}

message CancelRunResponse {}

message TerminateRunRequest {
  string workflow_id = 1;
  string run_id = 2;
  string reason = 3;
}

message TerminateRunResponse {}

message SignalRunRequest {
  string workflow_id = 1;
  string run_id = 2;
  string signal = 3;
  // Argument: JSON text; empty sends no argument (not null).
  string input = 4;
}

message SignalRunResponse {}

// ScheduleAction is one start the schedule made.
message ScheduleAction {
  google.protobuf.Timestamp schedule_time = 1;
  google.protobuf.Timestamp actual_time = 2;
  string workflow_id = 3;
  string run_id = 4;
}

// ScheduleState is a schedule as Temporal describes it.
message ScheduleState {
  bool paused = 1;
  // Why it is paused (or the last note).
  string note = 2;
  // The next starts, up to 5.
  repeated google.protobuf.Timestamp next_actions = 3;
  // The latest starts, newest last.
  repeated ScheduleAction recent_actions = 4;
  // Runs of it still going.
  repeated string running_workflow_ids = 5;
  int64 action_count = 6;
  int64 missed_catchup_window = 7;
  int64 overlap_skipped = 8;
  // Unset when Temporal does not say (updated: never updated).
  google.protobuf.Timestamp created = 9;
  google.protobuf.Timestamp updated = 10;
  // Workflow type of its action.
  string workflow_type = 11;
  // Memo backplane.service: the owning service; empty for a schedule
  // made by hand.
  string owner = 12;
}

message ScheduleInfo {
  string service = 1;
  string name = 2;
  // Temporal schedule id <service>/<name>.
  string id = 3;
  // The declaration; unset when no latest manifest declares it.
  backplane.v1.Schedule declared = 4;
  // Unset: Temporal has no such schedule (not reconciled yet).
  ScheduleState state = 5;
  // The wiring file that manages the schedule; empty when the console
  // does. A managed schedule is edited in its file: UpdateSchedule and
  // DeleteSchedule refuse it, pause, unpause and trigger do not.
  string managed_by = 6;
}

message ListSchedulesRequest {
  string service = 1;
  // Default 20, maximum 50. One bounded Temporal page per request.
  uint32 page_size = 2;
  bytes page_token = 3;
}

message ListSchedulesResponse {
  // Sorted by id within this page; page ordering belongs to Temporal.
  repeated ScheduleInfo schedules = 1;
  // Continue even if this page is empty after filtering non-platform ids.
  bytes next_page_token = 2;
}

message PauseScheduleRequest {
  string service = 1;
  string name = 2;
  string note = 3;
}

message PauseScheduleResponse {}

message UnpauseScheduleRequest {
  string service = 1;
  string name = 2;
  string note = 3;
}

message UnpauseScheduleResponse {}

message TriggerScheduleRequest {
  string service = 1;
  string name = 2;
}

message TriggerScheduleResponse {}

// ScheduleTiming replaces timing when supplied on update. Omit it to
// preserve timing, including advanced external settings.
message ScheduleTiming {
  repeated string cron = 1;
  google.protobuf.Duration interval = 2;
  string timezone = 3;
}
message ScheduleDefinition {
  string workflow = 1;
  // JSON input validated against the latest declared workflow schema.
  string input = 2;
  ScheduleTiming timing = 3;
  google.protobuf.Duration execution_timeout = 4;
}
message GetScheduleRequest { string service = 1; string name = 2; }
message GetScheduleResponse {
  ScheduleInfo schedule = 1;
  ScheduleDefinition definition = 2;
  // Opaque Temporal conflict token, required for UpdateSchedule.
  bytes revision = 3;
  // Normalized timing as JSON. Absent update timing keeps all these settings.
  string timing_json = 4;
}
message CreateScheduleRequest {
  string service = 1;
  string name = 2;
  ScheduleDefinition definition = 3;
  bool paused = 4;
}
message CreateScheduleResponse {}
message UpdateScheduleRequest {
  string service = 1;
  string name = 2;
  ScheduleDefinition definition = 3;
  bytes revision = 4;
}
message UpdateScheduleResponse {}
message DeleteScheduleRequest { string service = 1; string name = 2; }
message DeleteScheduleResponse {}
