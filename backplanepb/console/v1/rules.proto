syntax = "proto3";

package backplane.console.v1;

import "backplanepb/console/v1/calls.proto";
import "backplanepb/console/v1/step.proto";
import "backplanepb/console/v1/workflows.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/backplane-labs/backplane/backplanepb/console/v1;consolev1";

// RuleService is the console's view of rules (§8.1): a binding whose source
// is an event instead of a hook — same steps, same executor, no result.
// A rule is identified by a uuid; its definition is versioned like a
// binding's (a delete is a tombstone version), its pause is a flag outside
// the versions.
//
// Runs are workflows on backplane's task queue with id
// rule/<id>/<ce-id> (a test run: test/rule/<id>/<uuid>): TestRule,
// ListRuleRuns, GetRuleRun, CancelRuleRun.
service RuleService {
  // ListRules is every rule with its current version, deleted ones
  // included (their current version is the tombstone).
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  // GetRule is one version of a rule: the current one by default.
  rpc GetRule(GetRuleRequest) returns (GetRuleResponse);
  // ListRuleVersions pages through a rule's versions, newest first.
  rpc ListRuleVersions(ListRuleVersionsRequest) returns (ListRuleVersionsResponse);
  // ValidateRule is SaveRule without saving: the violations it would be
  // rejected with.
  rpc ValidateRule(ValidateRuleRequest) returns (ValidateRuleResponse);
  // SaveRule validates the definition and, when valid, saves it as the
  // next version of the rule (a new rule without id). Invalid: nothing is
  // saved, violations say why.
  rpc SaveRule(SaveRuleRequest) returns (SaveRuleResponse);
  // RollbackRule saves a new version with the name and definition of an
  // older one (rollback_of), validated as any save.
  rpc RollbackRule(RollbackRuleRequest) returns (RollbackRuleResponse);
  // DeleteRule saves a tombstone version: the rule stops, the history
  // stays.
  rpc DeleteRule(DeleteRuleRequest) returns (DeleteRuleResponse);
  // PauseRule stops starting runs for the rule's events until resumed.
  rpc PauseRule(PauseRuleRequest) returns (PauseRuleResponse);
  // ResumeRule undoes PauseRule.
  rpc ResumeRule(ResumeRuleRequest) returns (ResumeRuleResponse);
  // WatchRules streams ListRules: now, then again whenever it changes.
  rpc WatchRules(WatchRulesRequest) returns (stream WatchRulesResponse);

  // TestRule runs a rule on a sample event: the definition is compiled
  // against the latest manifests, `when` is evaluated on the event and,
  // when it matches (and not dry_run), a test run starts — workflow id
  // test/rule/<id>/<uuid> (draft instead of <id> for an unsaved
  // definition) — and the call waits for its end.
  rpc TestRule(TestRuleRequest) returns (TestRuleResponse);
  // ListRuleRuns is a rule's runs, newest first (Temporal visibility,
  // workflow id prefix rule/<id>/ or test/rule/<id>/).
  rpc ListRuleRuns(ListRuleRunsRequest) returns (ListRuleRunsResponse);
  // GetRuleRun is one run of the rule: status, input, result or failure,
  // pending activities, history and the steps' timeline.
  rpc GetRuleRun(GetRuleRunRequest) returns (GetRuleRunResponse);
  // CancelRuleRun requests cancellation of a run of the rule.
  rpc CancelRuleRun(CancelRuleRunRequest) returns (CancelRuleRunResponse);
}

// RuleDefinition is what a rule says: the event, the filter and the steps.
// Its protojson is the canonical form (the console edits it as YAML).
message RuleDefinition {
  // Full event name "<service>.<Event>".
  string event = 1;
  // CEL bool over `event` and `meta`: the rule runs only when true;
  // empty: always.
  string when = 2;
  // By name; order as in BindingDefinition.steps.
  map<string, Step> steps = 3;
  // Free text for people; not executed.
  string description = 4;
  // What runs the rule; unspecified: the installation's default.
  Runtime runtime = 5;
  // The graph editor's layout; ignored by compile and execution.
  EditorLayout editor = 15;
}

// RuleVersion is one saved version of a rule.
message RuleVersion {
  // uuid of the rule.
  string rule_id = 1;
  // Counts from 1 per rule.
  uint64 version = 2;
  string name = 3;
  // Absent on a tombstone.
  RuleDefinition definition = 4;
  // A tombstone: the delete of the rule.
  bool deleted = 5;
  string author = 6;
  string comment = 7;
  google.protobuf.Timestamp created_at = 8;
  // The version this one rolls back to; 0 when it is not a rollback.
  uint64 rollback_of = 9;
  // As BindingVersion.managed_by; pausing stays the console's.
  string managed_by = 10;
}

// RuleState is whether a rule runs.
enum RuleState {
  RULE_STATE_UNSPECIFIED = 0;
  // Runs on every matching event.
  RULE_STATE_ACTIVE = 1;
  // Paused: no runs start.
  RULE_STATE_PAUSED = 2;
  // The current version is a tombstone.
  RULE_STATE_DELETED = 3;
  // The current definition no longer compiles against the latest
  // manifests: no runs start until it is fixed. Rule.violations say why.
  RULE_STATE_BROKEN = 4;
}

// Rule is a rule as ListRules shows it.
message Rule {
  // uuid.
  string id = 1;
  // No runs start while paused.
  bool paused = 2;
  RuleVersion current = 3;
  google.protobuf.Timestamp created_at = 4;
  // BROKEN wins over PAUSED: a paused rule that no longer compiles is
  // broken.
  RuleState state = 5;
  // Why the current definition does not compile against the latest
  // manifests (state BROKEN); empty otherwise.
  repeated Violation violations = 6;
}

message ListRulesRequest {
  // Only rules of this event ("<service>.<Event>"); empty: all.
  string event = 1;
}

message ListRulesResponse {
  // By name, then id.
  repeated Rule rules = 1;
}

message GetRuleRequest {
  string id = 1;
  // 0: the current version.
  uint64 version = 2;
}

message GetRuleResponse {
  Rule rule = 1;
  // The version asked for.
  RuleVersion version = 2;
  // Why that version does not compile against the latest manifests;
  // empty when it does (or is a tombstone).
  repeated Violation violations = 3;
}

message ListRuleVersionsRequest {
  string id = 1;
  // Versions below this one; 0: from the newest.
  uint64 before = 2;
  // At most this many (default 50, at most 500).
  uint32 page_size = 3;
}

message ListRuleVersionsResponse {
  repeated RuleVersion versions = 1;
  // `before` of the next page; 0 when this is the last one.
  uint64 next_before = 2;
}

message ValidateRuleRequest {
  RuleDefinition definition = 1;
}

message ValidateRuleResponse {
  // Empty: the definition is valid.
  repeated Violation violations = 1;
}

message SaveRuleRequest {
  // Empty: a new rule.
  string id = 1;
  string name = 2;
  RuleDefinition definition = 3;
  string comment = 4;
  // The current version the edit started from. Set: the save is refused
  // with ABORTED when the rule's current version is another one. Unset
  // (and for a new rule): no check.
  optional uint64 base_version = 5;
}

message SaveRuleResponse {
  // The saved version; absent when the definition is rejected.
  RuleVersion version = 1;
  repeated Violation violations = 2;
}

message RollbackRuleRequest {
  string id = 1;
  // The version whose name and definition become the new version.
  uint64 version = 2;
  string comment = 3;
  // As SaveRuleRequest.base_version.
  optional uint64 base_version = 4;
}

message RollbackRuleResponse {
  RuleVersion version = 1;
  repeated Violation violations = 2;
}

message DeleteRuleRequest {
  string id = 1;
  string comment = 2;
  // As SaveRuleRequest.base_version.
  optional uint64 base_version = 3;
}

message DeleteRuleResponse {
  // The tombstone.
  RuleVersion version = 1;
}

message PauseRuleRequest {
  string id = 1;
  // As SaveRuleRequest.base_version: the pause applies to the version the
  // operator saw.
  optional uint64 base_version = 2;
}

message PauseRuleResponse {
  Rule rule = 1;
}

message ResumeRuleRequest {
  string id = 1;
  // As PauseRuleRequest.base_version.
  optional uint64 base_version = 2;
}

message ResumeRuleResponse {
  Rule rule = 1;
}

message WatchRulesRequest {
  // Only rules of this event; empty: all.
  string event = 1;
}

message WatchRulesResponse {
  repeated Rule rules = 1;
}

// ---- runs -------------------------------------------------------------------

// RuleEventMeta are the CloudEvents attributes of a sample event (the CEL
// variable `meta`).
message RuleEventMeta {
  // ce-id; empty: a new uuid.
  string id = 1;
  // ce-source; empty: the event's service.
  string source = 2;
  // ce-subject, the key; empty: none.
  string subject = 3;
  // ce-type; empty: the full event name.
  string type = 4;
  // ce-time; unset: now.
  google.protobuf.Timestamp time = 5;
}

message TestRuleRequest {
  // The saved rule (uuid); exclusive with definition.
  string id = 1;
  // Version of the saved rule; 0: the current one.
  uint64 version = 2;
  // An unsaved definition; exclusive with id.
  RuleDefinition definition = 3;
  // The event's payload: JSON text; empty is {}.
  string event = 4;
  RuleEventMeta meta = 5;
  // Only evaluate `when`: no run starts.
  bool dry_run = 6;
  // How long to wait for the run; zero: 30s, at most 10 minutes.
  google.protobuf.Duration timeout = 7;
}

message TestRuleResponse {
  // Violations of the definition; when present nothing was evaluated.
  repeated Violation violations = 1;
  // The event matched `when` (a rule without when always matches).
  bool matched = 2;
  // The event or `when` failed to evaluate ("transform failed at when:
  // ..."); matched is false then.
  string error = 3;
  // The attributes the event was evaluated with (defaults filled in).
  RuleEventMeta meta = 4;
  // The test run's end; absent when not matched or dry_run.
  CallResult result = 5;
}

message ListRuleRunsRequest {
  string id = 1;
  // Only this status.
  RunStatus status = 2;
  // Test runs (test/rule/<id>/) instead of the event runs (rule/<id>/).
  bool tests = 3;
  // At most this many (default 50, at most 500).
  uint32 page_size = 4;
  // From the previous response; empty: the first page.
  bytes page_token = 5;
}

message ListRuleRunsResponse {
  repeated Run runs = 1;
  // Empty on the last page.
  bytes next_page_token = 2;
  // The visibility query that was run.
  string query = 3;
}

message GetRuleRunRequest {
  // The rule; empty for a test run of an unsaved definition
  // (test/rule/draft/...).
  string id = 1;
  // A run of the rule: rule/<id>/... or test/rule/<id>/...
  string workflow_id = 2;
  // Empty: the latest run.
  string run_id = 3;
}

message GetRuleRunResponse {
  GetRunResponse run = 1;
  // The version that ran (0: an unsaved definition) and whether it is a
  // test run.
  uint64 version = 2;
  bool test = 3;
  // The program's steps by name, then every compensation in
  // the order it was scheduled.
  repeated StepRun steps = 4;
}

message CancelRuleRunRequest {
  // As GetRuleRunRequest.id.
  string id = 1;
  // A run of the rule: rule/<id>/... or test/rule/<id>/...
  string workflow_id = 2;
  string run_id = 3;
}

message CancelRuleRunResponse {}
