syntax = "proto3";

package backplane.console.v1;

import "backplanepb/console/v1/bindings.proto";
import "backplanepb/console/v1/rules.proto";
import "backplanepb/console/v1/step.proto";
import "backplanepb/v1/manifest.proto";

option go_package = "github.com/backplane-labs/backplane/backplanepb/console/v1;consolev1";

// WiringService is what the console's wiring editor needs besides
// BindingService and RuleService: the contracts there are to wire, the
// analysis of a definition (saved or a draft) for the graph and the
// editor's hints, and refactoring. Nothing here saves.
service WiringService {
  // GetWiringCatalog is every service's hooks, activities and events from
  // its latest manifest: the editor's palette and the types of its ports.
  rpc GetWiringCatalog(GetWiringCatalogRequest) returns (GetWiringCatalogResponse);
  // AnalyzeBinding validates a binding against the latest manifests and
  // describes it: the steps' levels and dependencies, the type of every
  // value and what every expression reads.
  rpc AnalyzeBinding(AnalyzeBindingRequest) returns (AnalyzeBindingResponse);
  // AnalyzeRule is AnalyzeBinding for a rule.
  rpc AnalyzeRule(AnalyzeRuleRequest) returns (AnalyzeRuleResponse);
  // RenameStep renames a step in a definition: its key, every `after`
  // naming it and every expression reading it (by the expressions'
  // syntax trees, so a string or a field of the same name is untouched).
  rpc RenameStep(RenameStepRequest) returns (RenameStepResponse);
}

message GetWiringCatalogRequest {}

message GetWiringCatalogResponse {
  // By service name.
  repeated WiringContract services = 1;
}

// WiringContract is what one service offers to wiring, from its latest
// manifest.
message WiringContract {
  string service = 1;
  // Version of the manifest.
  string version = 2;
  // Hooks a binding implements (input: `req`, output: the result).
  repeated backplane.v1.Hook hooks = 3;
  // Activities a step calls.
  repeated backplane.v1.Activity activities = 4;
  // Events a rule reacts to (schema: `event`).
  repeated backplane.v1.Event events = 5;
}

message AnalyzeBindingRequest {
  BindingDefinition definition = 1;
}

message AnalyzeBindingResponse {
  Analysis analysis = 1;
}

message AnalyzeRuleRequest {
  RuleDefinition definition = 1;
}

message AnalyzeRuleResponse {
  Analysis analysis = 1;
}

// Analysis is a definition as the compiler sees it. Parts that do not
// compile are left out of steps, types and references; violations say
// why.
message Analysis {
  // Empty: the definition is valid (SaveBinding/SaveRule would accept it).
  repeated Violation violations = 1;
  // By name.
  repeated StepAnalysis steps = 2;
  // The CEL type of every value node that compiled, by path.
  repeated ValueType types = 3;
  // Every variable an expression reads, by path, then position.
  repeated Reference references = 4;
  // JSON Pointers of the value nodes that carry secrets: their expression
  // reads a field a schema marks secret, or computes from one. The
  // console masks these values in runs. Empty until the definition is
  // valid.
  repeated string secrets = 5;
}

// StepAnalysis is where a step stands in the order of execution.
message StepAnalysis {
  string name = 1;
  // 0: depends on nothing; a step's level is one above its highest
  // dependency. -1: the step is in a cycle or its name is invalid.
  int32 level = 2;
  // The steps its input reads.
  repeated string data = 3;
  // The steps its `after` names.
  repeated string after = 4;
  // The steps its `when` reads.
  repeated string when = 5;
  // The steps its undo input reads (they are not dependencies: they must
  // have run before it).
  repeated string undo = 6;
  // The id of the for_each step whose body this step is in:
  // "<outer>/<inner>" in a nested body; empty at the top level. Names are
  // unique only within one body.
  string parent = 7;
  // CEL type of the item of a for_each step; empty without for_each.
  string item_type = 8;
}

// ValueType is the CEL type of a value node: "string", "int", "double",
// "bool", "bytes", "null", "list(string)", "map(string, dyn)", "object",
// "dyn", "timestamp", "duration".
message ValueType {
  // JSON Pointer of the node, as Violation.path.
  string path = 1;
  string type = 2;
}

// Reference is one read of a variable by an expression:
// /steps/send/input/subject reads render.subject.
message Reference {
  // JSON Pointer of the expression, as Violation.path.
  string path = 1;
  // The variable: "req", "event", "meta", "steps" or a step name.
  string variable = 2;
  // The field selections that follow the variable, outermost first:
  // ["subject"] for render.subject, ["send", "skipped"] for
  // steps.send.skipped; empty when the variable is used whole.
  repeated string fields = 3;
  // Where the read is in the expression.
  Range expr = 4;
}

message RenameStepRequest {
  oneof definition {
    BindingDefinition binding = 1;
    RuleDefinition rule = 2;
  }
  // The step's id: its name, or "<for-each step>/<name>" for a step of
  // a body (bodies nest).
  string from = 3;
  // Its new name: an identifier, not reserved, not taken by a step or an
  // item it would be seen with.
  string to = 4;
}

message RenameStepResponse {
  // The definition with the step renamed; absent with violations.
  oneof definition {
    BindingDefinition binding = 1;
    RuleDefinition rule = 2;
  }
  // Why the rename is refused (the new name is invalid or taken, the step
  // does not exist, an expression does not parse); empty on success.
  repeated Violation violations = 3;
}
