syntax = "proto3";

package backplane.console.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "schemapb/schema.proto";

option go_package = "github.com/backplane-labs/backplane/backplanepb/console/v1;consolev1";

// EventService is the console's view of events (§8): what every service
// declares, the JetStream streams behind them, the consumers that read
// them with their lag, and the dead letters of reactors. backplane reads
// NATS through its own connection (BACKPLANE_NATS_URL); without one the
// calls fail with FAILED_PRECONDITION. A configured but unavailable
// backend returns UNAVAILABLE; ListEvents can still return declarations.
service EventService {
  // Every event declared by the latest manifest of a service, with the
  // stream's counts and every subscriber (reactors of services, rules and
  // other consumers on the stream) with its consumer state.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  // One service's event stream and dead-letter stream, every consumer on
  // the event stream and the dead letters per reactor of the service.
  rpc GetStream(GetStreamRequest) returns (GetStreamResponse);
  // Messages of a service's event stream: a page forward from a sequence
  // or a time, or the newest ones.
  rpc PeekMessages(PeekMessagesRequest) returns (PeekMessagesResponse);
  // Publishes a declared event by hand, marked as a test (ce-bptest).
  rpc PublishTestEvent(PublishTestEventRequest) returns (PublishTestEventResponse);
  // Dead letters of a subscriber's reactors, oldest first.
  rpc ListDeadLetters(ListDeadLettersRequest) returns (ListDeadLettersResponse);
  // Publishes dead letters back to their reactor alone (its redrive
  // subject) and removes them from the dead-letter stream.
  rpc RedriveDeadLetters(RedriveDeadLettersRequest) returns (RedriveDeadLettersResponse);
  // Removes dead letters without handling them.
  rpc PurgeDeadLetters(PurgeDeadLettersRequest) returns (PurgeDeadLettersResponse);
}

// StreamState is a JetStream stream as the server reports it.
message StreamState {
  // bp_<service> or bp_dlq_<service>.
  string name = 1;
  // The stream is on the server; false: every other field is zero.
  bool exists = 2;
  repeated string subjects = 3;
  uint64 messages = 4;
  uint64 bytes = 5;
  uint64 first_seq = 6;
  google.protobuf.Timestamp first_time = 7;
  uint64 last_seq = 8;
  google.protobuf.Timestamp last_time = 9;
  uint32 consumers = 10;
  // Limits; zero max_age and negative max_bytes are unlimited.
  google.protobuf.Duration max_age = 11;
  int64 max_bytes = 12;
  int32 replicas = 13;
  google.protobuf.Duration dedup_window = 14;
  // Metadata bp.ensured-by (emitter, subscriber) and bp.kind (events,
  // dead-letters).
  string ensured_by = 15;
  string kind = 16;
}

// What kind of reader a consumer is.
enum SubscriberKind {
  SUBSCRIBER_KIND_UNSPECIFIED = 0;
  // A reactor a service declares (manifest subscriptions).
  SUBSCRIBER_KIND_REACTOR = 1;
  // A rule of backplane (backplane__rule_<id>, §8.1).
  SUBSCRIBER_KIND_RULE = 2;
  // Any other consumer on the stream.
  SUBSCRIBER_KIND_OTHER = 3;
}

// ConsumerState is a durable consumer as the server reports it.
message ConsumerState {
  // Messages of the filter not delivered yet: the lag.
  uint64 num_pending = 1;
  // Delivered, not acknowledged yet.
  uint64 num_ack_pending = 2;
  uint64 num_redelivered = 3;
  // Pull requests waiting.
  uint64 num_waiting = 4;
  // Stream sequence of the last delivery and of the ack floor.
  uint64 delivered_seq = 5;
  uint64 ack_floor_seq = 6;
  // Last delivery and last ack; unset: never.
  google.protobuf.Timestamp last_delivered = 7;
  google.protobuf.Timestamp last_acked = 8;
  bool paused = 9;
  google.protobuf.Timestamp created = 10;
  repeated string filter_subjects = 11;
  int64 max_deliver = 12;
  int64 max_ack_pending = 13;
  google.protobuf.Duration ack_wait = 14;
  // all, new, by_start_sequence, ...
  string deliver_policy = 15;
  // Metadata of the consumer (bp.service, bp.consumer, bp.event, ...).
  map<string, string> metadata = 16;
}

// Subscriber is one reader of an event.
message Subscriber {
  SubscriberKind kind = 1;
  // Subscribing service; for a rule "backplane"; empty for OTHER.
  string service = 2;
  // Consumer name of the manifest (reactor), the rule's; empty for OTHER.
  string consumer = 3;
  // Durable name in NATS (<subscriber>__<consumer>).
  string durable = 4;
  // Full event name the consumer reads.
  string event = 5;
  // Unset: the consumer is not on the server (the reactor has not
  // started, or NATS was not read).
  ConsumerState state = 6;
  // Dead letters of the reactor now (reactors only).
  uint64 dead_letters = 7;
  // The consumer accepts redrive from the console (its filters include
  // its redrive subject; older SDKs do not).
  bool redrive = 8;
}

// EventInfo is one declared event.
message EventInfo {
  // Full name <service>.<Event>.
  string event = 1;
  string service = 2;
  string name = 3;
  string description = 4;
  schemapb.Schema schema = 5;
  // Subject bp.<service>.<Event>.
  string subject = 6;
  // Messages of the event the stream keeps now.
  uint64 messages = 7;
  // The newest one: stream sequence and time; zero when there is none.
  uint64 last_seq = 8;
  google.protobuf.Timestamp last_time = 9;
  // Declared by the latest manifest of its service; false: only
  // subscriptions name it.
  bool declared = 10;
  repeated Subscriber subscribers = 11;
}

message ListEventsRequest {
  // Only the events of this service; empty: every service.
  string service = 1;
}

message ListEventsResponse {
  // Sorted by full name.
  repeated EventInfo events = 1;
  // Event streams of the services listed, by service.
  map<string, StreamState> streams = 2;
  // Why NATS state is missing (not configured, not connected); empty
  // when it was read.
  string nats_error = 3;
}

message GetStreamRequest {
  string service = 1;
}

// DeadLetterCount is how many dead letters one reactor has.
message DeadLetterCount {
  string consumer = 1;
  uint64 count = 2;
}

message GetStreamResponse {
  string service = 1;
  // The service's event stream bp_<service>.
  StreamState events = 2;
  // The dead letters of the service's own reactors, bp_dlq_<service>.
  StreamState dead_letters = 3;
  // Every consumer on the event stream, by durable name.
  repeated Subscriber consumers = 4;
  // Dead letters per reactor of the service (as a subscriber).
  repeated DeadLetterCount dead_letter_counts = 5;
}

// CloudEvent is the CloudEvents metadata of a message (ce-* headers).
message CloudEvent {
  string id = 1;
  string source = 2;
  // Full event name.
  string type = 3;
  // ce-subject: the key.
  string subject = 4;
  google.protobuf.Timestamp time = 5;
  string instance = 6;
  string version = 7;
  // Other ce-* headers without the prefix.
  map<string, string> extensions = 8;
}

// EventMessage is one stored message.
message EventMessage {
  uint64 seq = 1;
  string subject = 2;
  // Full event name of the subject or ce-type; empty when neither says.
  string event = 3;
  // When the stream stored it.
  google.protobuf.Timestamp stored_at = 4;
  // Every header, first value.
  map<string, string> headers = 5;
  CloudEvent cloud_event = 6;
  // Payload as JSON text when it is valid JSON; otherwise empty and raw
  // holds the bytes.
  string data = 7;
  bytes raw = 8;
  // Published by the console (ce-bptest).
  bool test = 9;
}

message PeekMessagesRequest {
  string service = 1;
  // Only this event (CamelCase name or full name); empty: every event.
  string event = 2;
  // Start: a stream sequence, else a time; neither: the newest messages.
  uint64 start_seq = 3;
  google.protobuf.Timestamp start_time = 4;
  // At most this many (default 50, at most 500).
  uint32 limit = 5;
}

message PeekMessagesResponse {
  // Oldest first.
  repeated EventMessage messages = 1;
  // start_seq of the next page forward; 0 when there are no more now.
  uint64 next_seq = 2;
  StreamState stream = 3;
}

message PublishTestEventRequest {
  // Full event name <service>.<Event>, declared by the service.
  string event = 1;
  // Payload: JSON text.
  string payload = 2;
  // ce-subject; optional.
  string key = 3;
  // More CloudEvents extensions: name ([a-z0-9]+) -> value.
  map<string, string> extensions = 4;
  // ce-id; empty: a new UUID.
  string id = 5;
}

message PublishTestEventResponse {
  string id = 1;
  string subject = 2;
  uint64 seq = 3;
  // JetStream dropped it as a duplicate of ce-id within the dedup window.
  bool duplicate = 4;
}

// DeadLetter is one message of a dead-letter stream.
message DeadLetter {
  // The message; seq, subject and stored_at are the dead-letter stream's.
  EventMessage message = 1;
  // Reactor that gave up (bp-consumer).
  string consumer = 2;
  // Last error (bp-error).
  string error = 3;
  // Deliveries before it was dead-lettered (bp-delivered).
  uint32 delivered = 4;
  // Subject of the original event (bp.<service>.<Event>, from ce-type).
  string event_subject = 5;
}

message ListDeadLettersRequest {
  // Service whose reactors gave up.
  string subscriber = 1;
  // One reactor; empty: every reactor of the service.
  string consumer = 2;
  // Page: dead-letter stream sequence to start at (0: the oldest).
  uint64 start_seq = 3;
  // At most this many (default 50, at most 500).
  uint32 limit = 4;
}

message ListDeadLettersResponse {
  repeated DeadLetter dead_letters = 1;
  uint64 next_seq = 2;
  // Dead letters per reactor now.
  repeated DeadLetterCount counts = 3;
  StreamState stream = 4;
}

message RedriveDeadLettersRequest {
  string subscriber = 1;
  // The reactor (consumer of the manifest); required.
  string consumer = 2;
  // Dead-letter stream sequences; empty with all: every dead letter of
  // the reactor.
  repeated uint64 seqs = 3;
  bool all = 4;
}

// SeqError is why one dead letter was not processed.
message SeqError {
  uint64 seq = 1;
  string error = 2;
}

message RedriveDeadLettersResponse {
  // Published back to the reactor and removed.
  uint64 redriven = 1;
  repeated SeqError failed = 2;
  // Subject the dead letters went to.
  string subject = 3;
}

message PurgeDeadLettersRequest {
  string subscriber = 1;
  // One reactor; empty: every reactor of the service (with no seqs).
  string consumer = 2;
  // Only these sequences; empty: all of the reactor (or the service).
  repeated uint64 seqs = 3;
}

message PurgeDeadLettersResponse {
  uint64 purged = 1;
  repeated SeqError failed = 2;
}
