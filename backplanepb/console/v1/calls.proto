syntax = "proto3";

package backplane.console.v1;

import "google/protobuf/duration.proto";

option go_package = "github.com/backplane-labs/backplane/backplanepb/console/v1;consolev1";

// CallService runs a hook or an activity from the console with a JSON
// input (§9, §7.2) and waits for the result. A call runs where its target
// runs: over the direct runtime (a binding backplane executes itself, an
// activity called on the service's platform port) it is a direct run,
// id direct/console/...; over Temporal it is a short workflow on
// backplane's own task queue with memo source = console:<session>, in
// Temporal with its input, output and error like any other. Either way
// the call is audited as hook.call or activity.run.
service CallService {
  // Raises a hook as its service would, handled by its binding: by the
  // direct runtime when the binding runs there (or the hook is unbound),
  // else as the Nexus operation <Name> of <service>.Hooks on endpoint
  // <service>. A Temporal binding without Temporal is a precondition
  // failure.
  rpc CallHook(CallHookRequest) returns (CallHookResponse);
  // Executes an activity by name with the ActivityCall envelope: an
  // activity of kind ACTIVITY is called on its service over the direct
  // transport, retried per max_attempts; one of kind WORKFLOW runs as a
  // Temporal child workflow and needs Temporal (else a precondition
  // failure).
  rpc RunActivity(RunActivityRequest) returns (RunActivityResponse);
}

// CallResult is how a call ended.
message CallResult {
  // Output: JSON text when it is valid JSON; otherwise empty and raw
  // holds the bytes. Empty on failure.
  string output = 1;
  bytes raw = 2;
  // Failure: the handler's message and the application error type
  // (backplane.NoBinding, backplane.HookFailed, backplane.Timeout,
  // backplane.NonRetryable, ...); empty on success.
  string error = 3;
  string error_type = 4;
  // The run that made the call.
  string workflow_id = 5;
  string run_id = 6;
  google.protobuf.Duration took = 7;
}

message CallHookRequest {
  // Full hook name <service>.<Name>, declared by the service.
  string hook = 1;
  // Input: JSON text; empty is {}.
  string input = 2;
  // Idempotency key: the run's id is hook/<service>/<Name>/<key> — the
  // same as the service's own call with hook.Key(key), so both join one
  // run; a completed one returns its result.
  string key = 3;
  // Deadline of the call; zero: the hook's declared timeout, else 30s.
  google.protobuf.Duration timeout = 4;
}

message CallHookResponse {
  CallResult result = 1;
}

message RunActivityRequest {
  // Full activity name <service>.<Name>, declared by the service.
  string activity = 1;
  // Input (ActivityCall.payload): JSON text; empty is {}.
  string input = 2;
  // Start-to-close of one attempt; zero: the declared one, else 1m.
  google.protobuf.Duration start_to_close = 3;
  // Attempts while the failure is retryable; 0: one (no retry). An
  // activity runs over the direct transport (the service's platform port)
  // with a growing pause between attempts; a workflow-kind activity runs
  // as a Temporal child workflow with Temporal's retry policy.
  int32 max_attempts = 4;
  // ActivityCall.step, for diagnostics; empty: "console".
  string step = 5;
}

message RunActivityResponse {
  CallResult result = 1;
}
