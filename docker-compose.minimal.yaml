# Minimal console. No Temporal, NATS, Collector, storage stack or gateway.
# make dev-minimal; optional infrastructure uses profiles in the base file.
services:
  backplane:
    image: gcr.io/distroless/static-debian12:nonroot
    command: [/app/bin/backplane]
    restart: unless-stopped
    ports: ["127.0.0.1:${BACKPLANE_MINIMAL_PORT:-8081}:8081"]
    volumes:
      - ./bin:/app/bin:ro
      - ./web/apps/console/dist:/app/web/apps/console/dist:ro
    environment:
      BACKPLANE_CONSUL_ADDR: consul:8500
      BACKPLANE_PG_DSN: postgres://backplane:backplane@postgres:5432/backplane?sslmode=disable
      BACKPLANE_ADMIN_TOKEN: ${DEV_ADMIN_TOKEN:-dev-admin-token-change-me}
      BACKPLANE_CONSOLE_PREFIX: /backplane
      BACKPLANE_CONSOLE_INSECURE_COOKIE: "true"
      BACKPLANE_CONSOLE_ASSETS_DIR: /app/web/apps/console/dist
      # When using profiles, opt in explicitly to the corresponding endpoints.
      BACKPLANE_NATS_URL: ${BACKPLANE_NATS_URL:-}
      BACKPLANE_TEMPORAL_ADDR: ${BACKPLANE_TEMPORAL_ADDR:-}
    depends_on: [consul, postgres]
