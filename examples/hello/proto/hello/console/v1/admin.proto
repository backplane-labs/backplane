syntax = "proto3";

package hello.console.v1;

option go_package = "github.com/backplane-labs/backplane/examples/hello/proto/hello/console/v1;helloconsolev1";

// Internal API of hello: for its console plugin only, via the relay.
service AdminService {
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
}

message GetStatsRequest {}

message GetStatsResponse {
  uint64 greetings = 1;
  string current_greeting = 2;
  // Greetings the audit reactor saw come off the event stream.
  uint64 audited = 3;
  // Whether the optional cache is there right now.
  bool cache_present = 4;
}
