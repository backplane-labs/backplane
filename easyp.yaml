# Proto lint/generate for backplanepb. Run through `make gen` / `make lint`:
# plugins are pinned in ./bin.
lint:
  use:
    - DEFAULT
  service_suffix: Service
  allow_comment_ignores: false
  except:
    # Sources live in backplanepb/v1, package is backplane.v1.
    - PACKAGE_DIRECTORY_MATCH
deps:
  - github.com/gopherex/schemapb@v1.9.7
generate:
  inputs:
    - directory: backplanepb
  plugins:
    - name: go
      out: .
      opts:
        paths: source_relative
    - name: go-grpc
      out: .
      opts:
        paths: source_relative
    - name: es
      out: web/packages/api/src/gen
      with_imports: true
      opts:
        target: ts
        import_extension: js
    - name: ws-es
      out: web/packages/api/src/gen
      opts:
        target: ts
        import_extension: js
breaking:
  against_git_ref: master
