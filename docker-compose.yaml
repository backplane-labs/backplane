# platform-in-a-box: the stack backplane and services run against.
# Base: PostgreSQL, Consul, Valkey. Optional profiles: events, workflows, full.
# `make up` starts the full test stack; plain compose starts only the base. Ports are published on localhost for development.
services:
  consul:
    image: hashicorp/consul:1.22
    command: agent -dev -client=0.0.0.0
    ports: ["8500:8500", "8600:8600/udp"]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: backplane
      POSTGRES_PASSWORD: backplane
      POSTGRES_DB: backplane
    ports: ["5433:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]

  # Shared short-lived state of backplane replicas (login attempts).
  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]

  nats:
    profiles: [events, full]
    image: nats:2-alpine
    command: -js -m 8222
    ports: ["4222:4222", "8222:8222"]

  # Dev server: SQLite in memory, Nexus enabled; enough for development
  # and conformance. Production runs a real Temporal cluster.
  temporal:
    profiles: [workflows, full]
    image: temporalio/temporal:1.5.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8233", "--namespace", "default"]
    ports: ["7233:7233", "8233:8233"]

volumes:
  pg: {}
