# Application audit (docs/audit-api.md) and errors (docs/errors.md): log
# records marked backplane.audit=true, and exception records (exception.*
# attributes, event.name=exception, the browser SDK's app.debug.kind), go
# to backplane's OTLP listener, which keeps them durably. Audit records go
# there ONLY: the main logs pipeline drops them (filter/no_audit), so an
# audit trail (actors, subjects, operators' notes) is never copied into the
# general log store; exceptions stay logs as well. Merge it with the main
# config:
#
#   otelcol-contrib --config=otel-collector.yaml --config=otel-collector.audit.yaml
#
# Needs the filter and attributes processors and the file_storage extension
# (otelcol-contrib, or a build with them). The queue directory must be
# writable and persistent: records wait there while backplane is down.
receivers:
  otlp:
    protocols:
      http:
        # Backplane's OTLP proxy marks what it forwards (browsers, public keys)
        # with X-Backplane-Ingest: proxy; such records never count as audit.
        include_metadata: true
extensions:
  file_storage/audit:
    directory: /var/lib/otelcol/audit
    create_directory: true
processors:
  attributes/ingest:
    actions:
      - key: backplane.ingest
        from_context: metadata.x-backplane-ingest
        action: upsert
  # The general logs keep everything but audit records.
  filter/no_audit:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["backplane.audit"] == true'
  # Drops what is neither audit nor an exception; audit never from the
  # public proxy, exceptions from it too (browsers report through it,
  # marked backplane.ingest=proxy).
  filter/backplane:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["backplane.audit.origin"] == "platform"'
        - 'attributes["backplane.audit"] == true and attributes["backplane.ingest"] == "proxy"'
        - 'attributes["backplane.audit"] != true and attributes["exception.type"] == nil and attributes["exception.message"] == nil and attributes["exception.stacktrace"] == nil and attributes["event.name"] != "exception" and event_name != "exception" and attributes["app.debug.kind"] != "exception"'
exporters:
  otlp_grpc/audit:
    endpoint: backplane:4317
    tls: {insecure: true}
    # With BACKPLANE_AUDIT_KEYS set on backplane:
    # headers: {authorization: "Bearer ${env:BACKPLANE_AUDIT_KEY}"}
    timeout: 10s
    retry_on_failure: {enabled: true, max_elapsed_time: 0}
    sending_queue: {enabled: true, storage: file_storage/audit}
service:
  extensions: [health_check, file_storage/audit]
  pipelines:
    # Replaces the main config's logs pipeline: its processors and
    # exporters again, plus filter/no_audit (a merge replaces lists).
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/no_audit]
      exporters: [otlp_http/logs]
    logs/backplane:
      receivers: [otlp]
      processors: [memory_limiter, attributes/ingest, filter/backplane]
      exporters: [otlp_grpc/audit]
